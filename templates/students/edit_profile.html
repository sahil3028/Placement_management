{% extends "base_dashboard.html" %}

{% block page_title %}
Edit Profile
{% endblock %}

{% block dashboard_content %}

<div class="card shadow-sm">

    <div class="card-body">

        <form method="post"
              enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary">

                Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
