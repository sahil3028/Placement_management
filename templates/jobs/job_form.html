{% extends "base_dashboard.html" %}

{% block page_title %}

{% block dashboard_content %}

<div class="card">

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

                Save Job

        </form>

    </div>
</div>

{% endblock %}
